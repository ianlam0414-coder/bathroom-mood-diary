<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bathroom Mood Diary</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

:root{
    --tile-size:110px;
    --tile-left:240px;
    --tile-top:190px;
}

body{
    overflow:hidden;
    background:#d8d0c4;
    touch-action:none;
}

#bathroom{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#d8cdbd;
}

/* ========================= */
/* background tiles */
/* ========================= */

#backgroundTiles{
    position:absolute;

    top:var(--tile-top);
    left:var(--tile-left);

    width:calc(100vw - var(--tile-left));
    height:calc(100vh - var(--tile-top));

    display:grid;

    grid-template-columns:
    repeat(auto-fill,var(--tile-size));

    grid-auto-rows:var(--tile-size);

    z-index:0;

    pointer-events:none;
}

.bgTile{
    background-color:#f7f3ee;

    background-image:
    url("./tile-baseold.png");

    background-size:cover;
    background-position:center;
}

/* ========================= */
/* atmosphere */
/* ========================= */

#moodOverlay{
    position:absolute;
    inset:0;

    pointer-events:none;

    opacity:0;

    transition:0.9s ease;

    z-index:3;

    mix-blend-mode:screen;

    backdrop-filter:blur(36px);

    filter:saturate(1.2);
}

/* ========================= */
/* fog */
/* ========================= */

.fog{
    position:absolute;
    inset:0;

    backdrop-filter:blur(1.5px);

    background:
    rgba(255,255,255,0.04);

    pointer-events:none;

    z-index:1;
}

/* ========================= */
/* TITLE */
/* ========================= */

.mainTitle{
    position:absolute;

    top:24px;
    left:40px;

    width:520px;

    z-index:60;

    pointer-events:none;
}

/* BIGGER TITLE */

.titleImage{

    width:500px;

    max-width:42vw;

    max-height:180px;

    object-fit:contain;

    object-position:left top;

    display:block;
}

/* subtitle */

.titleSubtitle{

    margin-top:6px;

    margin-left:8px;

    opacity:0.52;

    font-size:16px;

    letter-spacing:0.03em;

    line-height:1.4;
}

/* ========================= */
/* calendar */
/* ========================= */

.calendarHeader{
    position:absolute;

    top:35px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    align-items:center;
    gap:25px;

    z-index:60;

    background:
    rgba(255,255,255,0.45);

    backdrop-filter:blur(10px);

    padding:14px 24px;

    border-radius:25px;
}

.calendarHeader h1{
    font-size:34px;
    font-weight:300;
}

.calendarHeader button{
    width:40px;
    height:40px;

    border:none;

    border-radius:50%;

    background:white;

    cursor:pointer;

    font-size:20px;
}

/* ========================= */
/* tiles */
/* ========================= */

#tileGrid{
    position:absolute;

    top:var(--tile-top);
    left:var(--tile-left);

    display:grid;

    grid-template-columns:
    repeat(7,var(--tile-size));

    grid-auto-rows:var(--tile-size);

    gap:0;

    z-index:10;
}

.tile{
    width:var(--tile-size);
    height:var(--tile-size);

    position:relative;

    overflow:hidden;

    cursor:pointer;

    background-color:#f7f3ee;

    background-image:
    url("./tile-baseold.png");

    background-size:cover;
    background-position:center;

    border-radius:2px;

    box-shadow:
    inset 0 0 1px rgba(255,255,255,0.25),
    inset 0 -1px 2px rgba(0,0,0,0.06);

    transition:
    filter 0.3s,
    opacity 0.3s;
}

.tile.activeTile{
    z-index:100;

    filter:
    brightness(1.1)
    saturate(1.06);
}

.tile.dimmed{
    filter:
    brightness(0.9)
    saturate(0.92);
}

.dayNumber{
    position:absolute;

    top:10px;
    left:12px;

    font-size:14px;

    color:white;

    text-shadow:
    0 2px 10px rgba(0,0,0,0.55);
}

.tileNote{
    position:absolute;

    left:12px;
    right:12px;
    bottom:12px;

    font-size:13px;
    line-height:1.4;

    color:white;

    text-shadow:
    0 2px 10px rgba(0,0,0,0.6);

    opacity:0;

    transform:translateY(10px);

    transition:0.4s;

    word-break:break-word;
}

.tile.activeTile .tileNote{
    opacity:1;
    transform:translateY(0);
}

/* ========================= */
/* object tray */
/* ========================= */

#objectTray{
    position:absolute;

    left:20px;
    top:190px;

    width:190px;

    max-height:72vh;

    overflow-y:auto;

    background:
    rgba(255,255,255,0.45);

    backdrop-filter:blur(12px);

    border-radius:25px;

    padding:18px;

    z-index:80;

    transition:0.4s;
}

#objectTray.closed{
    transform:translateX(-165px);
}

#toggleTray{
    position:absolute;

    right:-18px;
    top:20px;

    width:38px;
    height:38px;

    border:none;

    border-radius:50%;

    background:white;

    cursor:pointer;
}

.trayTitle{
    margin-bottom:14px;

    font-size:14px;

    opacity:0.5;
}

.uploadLabel{
    display:block;

    width:100%;

    padding:10px;

    margin-bottom:14px;

    border-radius:14px;

    background:
    rgba(255,255,255,0.65);

    text-align:center;

    font-size:13px;

    cursor:pointer;
}

#objectUpload{
    display:none;
}

.trayItem{
    width:100%;
    height:90px;

    border-radius:18px;

    background:
    rgba(255,255,255,0.5);

    margin-bottom:12px;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:0.3s;
}

.trayItem:hover{
    transform:scale(1.03);
}

.trayItem img{
    width:70%;
    height:70%;

    object-fit:contain;
}

/* ========================= */
/* objects */
/* ========================= */

.object{
    position:absolute;

    width:180px;
    height:180px;

    cursor:grab;

    user-select:none;

    z-index:20;

    touch-action:none;

    contain:layout style paint;
}

.object img{
    width:100%;
    height:100%;

    object-fit:contain;

    pointer-events:none;

    image-rendering:auto;

    will-change:transform;

    transform:translateZ(0);

    backface-visibility:hidden;
}

.deleteObject{
    position:absolute;

    top:5px;
    right:5px;

    width:30px;
    height:30px;

    border:none;

    border-radius:50%;

    background:white;

    cursor:pointer;

    font-size:18px;

    opacity:0;

    transition:0.3s;

    z-index:5;
}

.object:hover .deleteObject{
    opacity:1;
}

.resizeHandle{
    position:absolute;

    right:4px;
    bottom:4px;

    width:24px;
    height:24px;

    border-radius:50%;

    background:white;

    border:1px solid rgba(0,0,0,0.2);

    cursor:nwse-resize;

    z-index:5;

    opacity:0;

    transition:0.3s;

    touch-action:none;
}

.object:hover .resizeHandle{
    opacity:1;
}

@media (hover:none){

    .deleteObject,
    .resizeHandle{
        opacity:1;
    }

}

/* ========================= */
/* popup */
/* ========================= */

#popup{
    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,0.35);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:200;
}

.popupCard{
    width:390px;
    max-width:90vw;

    background:
    rgba(255,255,255,0.94);

    backdrop-filter:blur(15px);

    border-radius:25px;

    padding:24px;
}

.popupCard h2{
    margin-bottom:18px;
    font-weight:400;
}

.popupCard label{
    display:block;

    margin-bottom:8px;

    opacity:0.7;
}

.tileSelector{
    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-bottom:20px;
}

.tileOption{
    width:65px;
    height:65px;

    border-radius:12px;

    background-size:cover;
    background-position:center;

    cursor:pointer;

    border:2px solid transparent;

    transition:0.3s;
}

.tileOption:hover,
.tileOption.selected{

    transform:scale(1.08);

    border-color:black;
}

textarea{
    width:100%;
    height:140px;

    resize:none;

    border:none;

    border-radius:15px;

    background:#f2f2f2;

    padding:15px;
}

.saveBtn{
    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    background:black;

    color:white;

    margin-top:18px;

    cursor:pointer;
}

.footerText{
    position:absolute;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    opacity:0.4;

    z-index:50;
}

/* ========================= */
/* tablet */
/* ========================= */

@media (max-width:1100px){

    :root{

        --tile-size:82px;
        --tile-left:220px;
        --tile-top:170px;

    }

    .mainTitle{
        width:420px;
    }

    .titleImage{
        width:400px;
        max-height:145px;
    }

    .titleSubtitle{
        font-size:14px;
        margin-left:6px;
    }

    .calendarHeader h1{
        font-size:28px;
    }

    #objectTray{
        top:170px;
        width:170px;
    }

    #objectTray.closed{
        transform:translateX(-145px);
    }

    .trayItem{
        height:78px;
    }

}

/* ========================= */
/* phone */
/* ========================= */

@media (max-width:768px){

    :root{

        --tile-size:48px;
        --tile-left:16px;
        --tile-top:190px;

    }

    .mainTitle{

        top:18px;
        left:18px;

        width:280px;
    }

    .titleImage{

        width: 700px;px;

        max-width:72vw;

        max: height 200px;px;
    }

    .titleSubtitle{

        font-size:11px;

        margin-top:2px;

        margin-left:4px;

        line-height:1.3;
    }

    .calendarHeader{
        top:98px;
        left:18px;

        transform:none;

        gap:14px;

        padding:10px 16px;
    }

    .calendarHeader h1{
        font-size:22px;
    }

    .calendarHeader button{
        width:34px;
        height:34px;
    }

    #objectTray{
        top:190px;
        left:16px;

        width:120px;

        padding:12px;

        border-radius:18px;
    }

    #objectTray.closed{
        transform:translateX(-98px);
    }

    #toggleTray{
        width:32px;
        height:32px;

        right:-16px;
    }

    .trayTitle{
        font-size:12px;
    }

    .trayItem{
        height:58px;

        border-radius:14px;
    }

    .dayNumber{
        font-size:11px;

        top:5px;
        left:6px;
    }

    .tileNote{
        font-size:9px;

        left:5px;
        right:5px;
        bottom:5px;
    }

    .object{
        width:100px;
        height:100px;
    }

    .footerText{
        display:none;
    }

}

@media (max-width:420px){

    :root{

        --tile-size:42px;
        --tile-left:14px;
        --tile-top:185px;

    }

    #objectTray{
        width:108px;
    }

    #objectTray.closed{
        transform:translateX(-88px);
    }

}

</style>
</head>

<body>

<div id="bathroom">

    <div id="backgroundTiles"></div>

    <div id="moodOverlay"></div>

    <div class="fog"></div>

    <!-- TITLE -->

    <div class="mainTitle">

        <img
            class="titleImage"
            src="./title-handwriting.png"
            alt="Bathroom Mood Diary"
        >

        <p class="titleSubtitle">
            Leave your emotions on the wall
        </p>

    </div>

    <!-- calendar -->

    <div class="calendarHeader">

        <button onclick="changeMonth(-1)">
            ←
        </button>

        <h1 id="monthTitle"></h1>

        <button onclick="changeMonth(1)">
            →
        </button>

    </div>

    <!-- tray -->

    <div id="objectTray">

        <button id="toggleTray">
            ←
        </button>

        <div class="trayTitle">
            Bathroom Objects
        </div>

        <label
            class="uploadLabel"
            for="objectUpload"
        >
            + Upload Object
        </label>

        <input
            type="file"
            id="objectUpload"
            accept="image/png,image/jpeg,image/jpg,image/gif,image/webp"
        >

        <!-- PNG ICON + GIF SPAWN -->

        <div
            class="trayItem"
            onclick="spawnObject('./toilet.gif')"
        >
            <img src="./toilet.png">
        </div>

        <div
            class="trayItem"
            onclick="spawnObject('./sink.gif')"
        >
            <img src="./sink.png">
        </div>

        <div
            class="trayItem"
            onclick="spawnObject('./shower.gif')"
        >
            <img src="./shower.png">
        </div>

        <div
            class="trayItem"
            onclick="spawnObject('./mirror.gif')"
        >
            <img src="./mirror.png">
        </div>

        <div id="customObjectList"></div>

    </div>

    <!-- tiles -->

    <div id="tileGrid"></div>

    <!-- popup -->

    <div id="popup">

        <div class="popupCard">

            <h2 id="popupTitle">
                Day
            </h2>

            <label>
                Choose Tile Mood
            </label>

            <div class="tileSelector">

                <div
                    class="tileOption selected"
                    style="background-image:url('./tile-blue.png')"
                    onclick="selectTile(this,'./tile-blue.png','#8fb6ff')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('./tile-pink.png')"
                    onclick="selectTile(this,'./tile-pink.png','#ffb3d9')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('./tile-green.png')"
                    onclick="selectTile(this,'./tile-green.png','#9fd9b3')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('./tile-purple.png')"
                    onclick="selectTile(this,'./tile-purple.png','#b99cff')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('./tile-orange.png')"
                    onclick="selectTile(this,'./tile-orange.png','#ffb36b')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('./tile-red.png')"
                    onclick="selectTile(this,'./tile-red.png','#ff7a7a')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('./tile-black.png')"
                    onclick="selectTile(this,'./tile-black.png','#000000')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('./tile-grey.png')"
                    onclick="selectTile(this,'./tile-grey.png','#8a8a8a')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('./tile-baseold.png')"
                    onclick="selectTile(this,'./tile-baseold.png','#ffffff')"
                ></div>

                 <div
                    class="tileOption"
                    style="background-image:url('./tile-yellow.png')"
                    onclick="selectTile(this,'./tile-yellow.png','#ffcb00')"
                ></div>

            </div>

            <textarea
                id="noteInput"
                placeholder="What did this bathroom moment feel like?"
            ></textarea>

            <button
                class="saveBtn"
                onclick="saveTile()"
            >
                Save Memory
            </button>

        </div>

    </div>

    <div class="footerText">

        Every tile remembers something.

    </div>

</div>

<script>

const STORAGE_KEY =
    "bathroomMoodDiaryData";

let savedData = JSON.parse(

    localStorage.getItem(STORAGE_KEY)

) || {

    tiles:{},
    objects:[],
    customObjects:[]

};

if(!savedData.customObjects){

    savedData.customObjects = [];

}

function saveData(){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(savedData)

    );

}

const tileGrid =
    document.getElementById("tileGrid");

const backgroundTiles =
    document.getElementById("backgroundTiles");

const moodOverlay =
    document.getElementById("moodOverlay");

const customObjectList =
    document.getElementById("customObjectList");

const objectUpload =
    document.getElementById("objectUpload");

let currentDate =
    new Date();

let currentMonth =
    currentDate.getMonth();

let currentYear =
    currentDate.getFullYear();

let currentTile = null;

let selectedTileImage =
    "./tile-blue.png";

let selectedMoodColor =
    "#8fb6ff";

/* background */

function getCssVar(name){

    return getComputedStyle(
        document.documentElement
    )
    .getPropertyValue(name)
    .trim();

}

function getTileSize(){

    return parseInt(

        getCssVar("--tile-size")

    );

}

function generateBackgroundTiles(){

    backgroundTiles.innerHTML = "";

    const tileSize =
        getTileSize();

    const columns = Math.ceil(

        backgroundTiles.offsetWidth
        / tileSize

    ) + 2;

    const rows = Math.ceil(

        backgroundTiles.offsetHeight
        / tileSize

    ) + 2;

    const totalTiles =
        columns * rows;

    for(let i=0; i<totalTiles; i++){

        const bgTile =
            document.createElement("div");

        bgTile.className =
            "bgTile";

        backgroundTiles.appendChild(bgTile);

    }

}

/* calendar */

function generateCalendar(){

    tileGrid.innerHTML = "";

    const daysInMonth = new Date(

        currentYear,
        currentMonth + 1,
        0

    ).getDate();

    const monthNames = [

        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"

    ];

    document.getElementById("monthTitle")
        .innerText =

        `${monthNames[currentMonth]} ${currentYear}`;

    for(let i=1; i<=daysInMonth; i++){

        const tile =
            document.createElement("div");

        const key =

            `${currentYear}-${currentMonth+1}-${i}`;

        const savedTile =
            savedData.tiles[key];

        tile.className = "tile";

        tile.dataset.day = i;

        tile.dataset.color =

            savedTile
            ? savedTile.color
            : "#8fb6ff";

        tile.dataset.note =

            savedTile
            ? savedTile.note
            : "";

        if(savedTile){

            tile.style.backgroundImage =
                `url('${savedTile.image}')`;

        }

        tile.innerHTML = `

            <div class="dayNumber">
                ${i}
            </div>

            <div class="tileNote">
                ${savedTile ? savedTile.note : ""}
            </div>

        `;

        tile.addEventListener("mouseenter",()=>{

            activateTile(tile);

        });

        tile.addEventListener("mouseleave",()=>{

            deactivateTile(tile);

        });

        tile.addEventListener("click",()=>{

            openPopup(tile);

        });

        tileGrid.appendChild(tile);

    }

}

/* hover */

function activateTile(tile){

    document
    .querySelectorAll(".tile")
    .forEach(t=>{

        t.classList.add("dimmed");

    });

    tile.classList.remove("dimmed");

    tile.classList.add("activeTile");

    const color =
        tile.dataset.color || "#8fb6ff";

    moodOverlay.style.opacity = "1";

    moodOverlay.style.background = `

        radial-gradient(
            circle at 55% 42%,
            ${color}45 0%,
            ${color}26 28%,
            ${color}12 55%,
            rgba(255,255,255,0.02) 100%
        ),

        linear-gradient(
            to bottom,
            ${color}18 0%,
            ${color}0d 45%,
            rgba(255,255,255,0.02) 100%
        )

    `;

}

function deactivateTile(tile){

    document
    .querySelectorAll(".tile")
    .forEach(t=>{

        t.classList.remove("dimmed");

    });

    tile.classList.remove("activeTile");

    moodOverlay.style.opacity = "0";

}

/* popup */

const popup =
    document.getElementById("popup");

function openPopup(tile){

    currentTile = tile;

    popup.style.display = "flex";

    document.getElementById("popupTitle")
        .innerText =

        `Day ${tile.dataset.day}`;

    document.getElementById("noteInput")
        .value =

        tile.dataset.note || "";

}

popup.addEventListener("click",(e)=>{

    if(e.target === popup){

        popup.style.display = "none";

    }

});

/* select tile */

function selectTile(
    element,
    image,
    color
){

    selectedTileImage = image;

    selectedMoodColor = color;

    document
    .querySelectorAll(".tileOption")
    .forEach(option=>{

        option.classList.remove("selected");

    });

    element.classList.add("selected");

}

/* save tile */

function saveTile(){

    const note =
        document.getElementById("noteInput")
        .value;

    currentTile.style.backgroundImage =

        `url('${selectedTileImage}')`;

    currentTile.dataset.color =
        selectedMoodColor;

    currentTile.dataset.note =
        note;

    currentTile.querySelector(".tileNote")
        .innerText = note;

    const key =

        `${currentYear}-${currentMonth+1}-${currentTile.dataset.day}`;

    savedData.tiles[key] = {

        image:selectedTileImage,

        color:selectedMoodColor,

        note:note

    };

    saveData();

    popup.style.display = "none";

    document.getElementById("noteInput")
        .value = "";

}

/* upload */

function renderCustomObjects(){

    customObjectList.innerHTML = "";

    savedData.customObjects.forEach((item)=>{

        const div =
            document.createElement("div");

        div.className = "trayItem";

        div.onclick = ()=>{

            spawnObject(item.src);

        };

        div.innerHTML = `

            <img src="${item.src}">

        `;

        customObjectList.appendChild(div);

    });

}

objectUpload.addEventListener("change",(e)=>{

    const file = e.target.files[0];

    if(!file) return;

    const reader =
        new FileReader();

    reader.onload = ()=>{

        const imageData =
            reader.result;

        savedData.customObjects.push({

            src:imageData,

            type:file.type

        });

        saveData();

        renderCustomObjects();

        objectUpload.value = "";

    };

    reader.readAsDataURL(file);

});

/* month */

function changeMonth(direction){

    currentMonth += direction;

    if(currentMonth > 11){

        currentMonth = 0;

        currentYear++;

    }

    if(currentMonth < 0){

        currentMonth = 11;

        currentYear--;

    }

    generateCalendar();

}

/* objects */

function updateObjectsStorage(){

    savedData.objects = [];

    document
    .querySelectorAll(".object")
    .forEach(obj=>{

        savedData.objects.push({

            image:
            obj.dataset.image,

            left:
            obj.style.left,

            top:
            obj.style.top,

            width:
            obj.style.width,

            height:
            obj.style.height

        });

    });

    saveData();

}

function makeDraggableAndResizable(item){

    let mode = null;

    let startX = 0;
    let startY = 0;

    let startLeft = 0;
    let startTop = 0;

    let startWidth = 0;
    let startHeight = 0;

    item.addEventListener("pointerdown",(e)=>{

        if(
            e.target.classList.contains(
                "deleteObject"
            )
        ) return;

        e.preventDefault();

        const isResize =

            e.target.classList.contains(
                "resizeHandle"
            );

        mode =
            isResize
            ? "resize"
            : "drag";

        startX = e.clientX;
        startY = e.clientY;

        startLeft = item.offsetLeft;
        startTop = item.offsetTop;

        startWidth = item.offsetWidth;
        startHeight = item.offsetHeight;

        item.setPointerCapture(e.pointerId);

        item.style.cursor =

            isResize
            ? "nwse-resize"
            : "grabbing";

    });

    item.addEventListener("pointermove",(e)=>{

        if(!mode) return;

        e.preventDefault();

        const dx =
            e.clientX - startX;

        const dy =
            e.clientY - startY;

        if(mode === "drag"){

            item.style.left =
                startLeft + dx + "px";

            item.style.top =
                startTop + dy + "px";

        }

        if(mode === "resize"){

            const newSize = Math.max(

                45,

                Math.max(
                    startWidth + dx,
                    startHeight + dy
                )

            );

            item.style.width =
                newSize + "px";

            item.style.height =
                newSize + "px";

        }

    });

    item.addEventListener("pointerup",(e)=>{

        mode = null;

        try{

            item.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}

        item.style.cursor = "grab";

        updateObjectsStorage();

    });

    item.addEventListener("pointercancel",()=>{

        mode = null;

        item.style.cursor = "grab";

        updateObjectsStorage();

    });

}

function spawnObject(
    image,
    savedObj = null
){

    const obj =
        document.createElement("div");

    obj.className = "object";

    obj.dataset.image = image;

    obj.style.left =

        savedObj
        ? savedObj.left
        : "300px";

    obj.style.top =

        savedObj
        ? savedObj.top
        : "300px";

    obj.style.width =

        savedObj
        ? savedObj.width
        : "180px";

    obj.style.height =

        savedObj
        ? savedObj.height
        : "180px";

    obj.innerHTML = `

        <img
            draggable="false"
            src="${image}"
        >

        <button class="deleteObject">
            ×
        </button>

        <div class="resizeHandle"></div>

    `;

    document
    .getElementById("bathroom")
    .appendChild(obj);

    makeDraggableAndResizable(obj);

    obj.querySelector(".deleteObject")
    .addEventListener("click",(e)=>{

        e.stopPropagation();

        obj.remove();

        updateObjectsStorage();

    });

    if(!savedObj){

        updateObjectsStorage();

    }

}

/* tray */

const tray =
    document.getElementById("objectTray");

const toggleTray =
    document.getElementById("toggleTray");

let trayOpen = true;

toggleTray.addEventListener("click",()=>{

    trayOpen = !trayOpen;

    if(!trayOpen){

        tray.classList.add("closed");

        toggleTray.innerText = "→";

    }else{

        tray.classList.remove("closed");

        toggleTray.innerText = "←";

    }

});

window.addEventListener("resize",()=>{

    generateBackgroundTiles();

    generateCalendar();

});

/* init */

generateBackgroundTiles();

generateCalendar();

renderCustomObjects();

savedData.objects.forEach(obj=>{

    spawnObject(obj.image,obj);

});
