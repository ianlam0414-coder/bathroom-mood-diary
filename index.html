<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bathroom Mood Diary</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:#d8d0c4;
    touch-action:none;
}

/* ========================= */
/* bathroom */
/* ========================= */

#bathroom{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#d8cdbd;
}

/* ========================= */
/* full wall tiles */
/* ========================= */

#backgroundTiles{
    position:absolute;

    top:120px;
    left:240px;

    width:calc(100vw - 240px);
    height:calc(100vh - 120px);

    display:grid;

    grid-template-columns:
    repeat(auto-fill,110px);

    grid-auto-rows:110px;

    z-index:0;

    pointer-events:none;
}

.bgTile{
    background-image:url("tile-baseold.png");
    background-size:cover;
    background-position:center;
}

/* ========================= */
/* atmosphere overlay */
/* ========================= */

#moodOverlay{
    position:absolute;
    inset:0;

    pointer-events:none;

    opacity:0;

    transition:0.9s ease;

    z-index:3;

    mix-blend-mode:screen;

    backdrop-filter:blur(40px);

    filter:saturate(1.15);
}

/* ========================= */
/* fog */
/* ========================= */

.fog{
    position:absolute;
    inset:0;

    backdrop-filter:blur(1.5px);

    background:
    rgba(255,255,255,0.03);

    pointer-events:none;

    z-index:1;
}

/* ========================= */
/* title */
/* ========================= */

.mainTitle{
    position:absolute;

    top:35px;
    left:40px;

    z-index:60;
}

.mainTitle h2{
    font-size:42px;
    font-weight:300;
}

.mainTitle p{
    margin-top:8px;
    opacity:0.5;
}

/* ========================= */
/* calendar header */
/* ========================= */

.calendarHeader{
    position:absolute;

    top:35px;
    left:50%;

    transform:translateX(-50%);

    display:flex;
    align-items:center;
    gap:25px;

    z-index:60;

    background:
    rgba(255,255,255,0.45);

    backdrop-filter:blur(10px);

    padding:14px 24px;

    border-radius:25px;
}

.calendarHeader h1{
    font-size:34px;
    font-weight:300;
}

.calendarHeader button{
    width:40px;
    height:40px;

    border:none;

    border-radius:50%;

    background:white;

    cursor:pointer;

    font-size:20px;
}

/* ========================= */
/* calendar tiles */
/* ========================= */

#tileGrid{
    position:absolute;

    top:120px;
    left:240px;

    display:grid;

    grid-template-columns:
    repeat(7,110px);

    grid-auto-rows:110px;

    gap:0;

    z-index:10;
}

.tile{
    width:110px;
    height:110px;

    position:relative;

    overflow:hidden;

    cursor:pointer;

    background-color:transparent;

    backdrop-filter:brightness(1.02);

    background-size:cover;
    background-position:center;

    border-radius:2px;

    box-shadow:
    inset 0 0 1px rgba(255,255,255,0.3),
    inset 0 -1px 2px rgba(0,0,0,0.08);

    transition:
    filter 0.3s,
    box-shadow 0.3s;
}

.tile.activeTile{
    z-index:100;

    filter:brightness(1.08);
}

.tile.dimmed{
    filter:
    brightness(0.92)
    saturate(0.95);
}

.emptyTile{
    opacity:0;
    pointer-events:none;
}

/* ========================= */
/* day number */
/* ========================= */

.dayNumber{
    position:absolute;

    top:10px;
    left:12px;

    font-size:14px;

    color:white;

    text-shadow:
    0 2px 10px rgba(0,0,0,0.55);
}

/* ========================= */
/* note */
/* ========================= */

.tileNote{
    position:absolute;

    left:12px;
    right:12px;
    bottom:12px;

    font-size:13px;
    line-height:1.4;

    color:white;

    text-shadow:
    0 2px 10px rgba(0,0,0,0.6);

    opacity:0;

    transform:translateY(10px);

    transition:0.4s;

    word-break:break-word;
}

.tile.activeTile .tileNote{
    opacity:1;
    transform:translateY(0);
}

/* ========================= */
/* object tray */
/* ========================= */

#objectTray{
    position:absolute;

    left:20px;
    top:120px;

    width:190px;

    background:
    rgba(255,255,255,0.45);

    backdrop-filter:blur(12px);

    border-radius:25px;

    padding:18px;

    z-index:80;

    transition:0.4s;
}

#objectTray.closed{
    transform:translateX(-165px);
}

#toggleTray{
    position:absolute;

    right:-18px;
    top:20px;

    width:38px;
    height:38px;

    border:none;

    border-radius:50%;

    background:white;

    cursor:pointer;
}

.trayTitle{
    margin-bottom:16px;

    font-size:14px;

    opacity:0.5;
}

.trayItem{
    width:100%;
    height:90px;

    border-radius:18px;

    background:
    rgba(255,255,255,0.5);

    margin-bottom:12px;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    transition:0.3s;
}

.trayItem:hover{
    transform:scale(1.03);
}

.trayItem img{
    width:70%;
    height:70%;

    object-fit:contain;
}

/* ========================= */
/* draggable objects */
/* ========================= */

.object{
    position:absolute;

    width:180px;
    height:180px;

    cursor:grab;

    user-select:none;

    z-index:20;

    touch-action:none;
}

.object img{
    width:100%;
    height:100%;

    object-fit:contain;

    pointer-events:none;
}

.deleteObject{
    position:absolute;

    top:5px;
    right:5px;

    width:30px;
    height:30px;

    border:none;

    border-radius:50%;

    background:white;

    cursor:pointer;

    font-size:18px;

    opacity:0;

    transition:0.3s;

    z-index:5;
}

.object:hover .deleteObject{
    opacity:1;
}

.resizeHandle{
    position:absolute;

    right:4px;
    bottom:4px;

    width:24px;
    height:24px;

    border-radius:50%;

    background:white;

    border:1px solid rgba(0,0,0,0.2);

    cursor:nwse-resize;

    z-index:5;

    opacity:0;

    transition:0.3s;

    touch-action:none;
}

.object:hover .resizeHandle{
    opacity:1;
}

@media (hover:none){

    .deleteObject,
    .resizeHandle{
        opacity:1;
    }

}

/* ========================= */
/* popup */
/* ========================= */

#popup{
    position:fixed;

    inset:0;

    background:
    rgba(0,0,0,0.45);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:200;
}

.popupCard{
    width:390px;
    max-width:90vw;

    background:
    rgba(255,255,255,0.94);

    backdrop-filter:blur(15px);

    border-radius:25px;

    padding:24px;
}

.popupCard h2{
    margin-bottom:18px;
    font-weight:400;
}

.popupCard label{
    display:block;

    margin-bottom:8px;

    opacity:0.7;
}

.tileSelector{
    display:flex;

    gap:10px;

    flex-wrap:wrap;

    margin-bottom:20px;
}

.tileOption{
    width:65px;
    height:65px;

    border-radius:12px;

    background-size:cover;
    background-position:center;

    cursor:pointer;

    border:2px solid transparent;

    transition:0.3s;
}

.tileOption:hover,
.tileOption.selected{

    transform:scale(1.08);

    border-color:black;
}

textarea{
    width:100%;
    height:140px;

    resize:none;

    border:none;

    border-radius:15px;

    background:#f2f2f2;

    padding:15px;
}

.saveBtn{
    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    background:black;

    color:white;

    margin-top:18px;

    cursor:pointer;
}

/* ========================= */
/* footer */
/* ========================= */

.footerText{
    position:absolute;

    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    opacity:0.4;

    z-index:50;
}

/* ========================= */
/* mobile */
/* ========================= */

@media (max-width:768px){

    .mainTitle{
        top:20px;
        left:20px;
    }

    .mainTitle h2{
        font-size:30px;
    }

    .calendarHeader{
        top:90px;
        left:20px;
        transform:none;
    }

    #backgroundTiles,
    #tileGrid{
        top:170px;
        left:20px;
    }

    #backgroundTiles{
        width:calc(100vw - 20px);
        height:calc(100vh - 170px);
    }

    #objectTray{
        top:170px;
        left:20px;
    }

    .footerText{
        display:none;
    }

}

</style>
</head>

<body>

<div id="bathroom">

    <div id="backgroundTiles"></div>

    <div id="moodOverlay"></div>

    <div class="fog"></div>

    <!-- title -->

    <div class="mainTitle">

        <h2>Bathroom Mood Diary</h2>

        <p>
            Leave your emotions on the wall
        </p>

    </div>

    <!-- calendar header -->

    <div class="calendarHeader">

        <button onclick="changeMonth(-1)">
            ←
        </button>

        <h1 id="monthTitle"></h1>

        <button onclick="changeMonth(1)">
            →
        </button>

    </div>

    <!-- object tray -->

    <div id="objectTray">

        <button id="toggleTray">
            ←
        </button>

        <div class="trayTitle">
            Bathroom Objects
        </div>

        <div
            class="trayItem"
            onclick="spawnObject('toilet.png')"
        >
            <img src="toilet.png">
        </div>

        <div
            class="trayItem"
            onclick="spawnObject('sink.png')"
        >
            <img src="sink.png">
        </div>

        <div
            class="trayItem"
            onclick="spawnObject('shower.png')"
        >
            <img src="shower.png">
        </div>

        <div
            class="trayItem"
            onclick="spawnObject('mirror.png')"
        >
            <img src="mirror.png">
        </div>

    </div>

    <!-- calendar tiles -->

    <div id="tileGrid"></div>

    <!-- popup -->

    <div id="popup">

        <div class="popupCard">

            <h2 id="popupTitle">
                Day
            </h2>

            <label>
                Choose Tile Mood
            </label>

            <div class="tileSelector">

                <div
                    class="tileOption selected"
                    style="background-image:url('tile-blue.png')"
                    onclick="selectTile(this,'tile-blue.png','#8fb6ff')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-pink.png')"
                    onclick="selectTile(this,'tile-pink.png','#ffb3d9')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-green.png')"
                    onclick="selectTile(this,'tile-green.png','#9fd9b3')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-purple.png')"
                    onclick="selectTile(this,'tile-purple.png','#b99cff')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-orange.png')"
                    onclick="selectTile(this,'tile-orange.png','#ffb36b')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-red.png')"
                    onclick="selectTile(this,'tile-red.png','#ff7a7a')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-grey.png')"
                    onclick="selectTile(this,'tile-grey.png','#8a8a8a')"
                ></div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-white.png')"
                    onclick="selectTile(this,'tile-white.png','#ffffff')"
                ></div>

            </div>

            <textarea
                id="noteInput"
                placeholder="What did this bathroom moment feel like?"
            ></textarea>

            <button
                class="saveBtn"
                onclick="saveTile()"
            >
                Save Memory
            </button>

        </div>

    </div>

    <div class="footerText">

        Every tile remembers something.

    </div>

</div>

<script>

/* ========================= */
/* storage */
/* ========================= */

const STORAGE_KEY =
    "bathroomMoodDiaryData";

let savedData = JSON.parse(

    localStorage.getItem(STORAGE_KEY)

) || {

    tiles:{},
    objects:[]

};

function saveData(){

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(savedData)

    );

}

/* ========================= */
/* globals */
/* ========================= */

const tileGrid =
    document.getElementById("tileGrid");

const backgroundTiles =
    document.getElementById("backgroundTiles");

const moodOverlay =
    document.getElementById("moodOverlay");

let currentDate =
    new Date();

let currentMonth =
    currentDate.getMonth();

let currentYear =
    currentDate.getFullYear();

let currentTile = null;

let selectedTileImage =
    "tile-blue.png";

let selectedMoodColor =
    "#8fb6ff";

/* ========================= */
/* responsive positions */
/* ========================= */

function getTilePosition(){

    const isMobile =
        window.innerWidth <= 768;

    return {

        left:
        isMobile ? 20 : 240,

        top:
        isMobile ? 170 : 120

    };

}

/* ========================= */
/* background tiles */
/* ========================= */

function generateBackgroundTiles(){

    backgroundTiles.innerHTML = "";

    const tileSize = 110;

    const pos =
        getTilePosition();

    backgroundTiles.style.left =
        pos.left + "px";

    backgroundTiles.style.top =
        pos.top + "px";

    backgroundTiles.style.width =
        `calc(100vw - ${pos.left}px)`;

    backgroundTiles.style.height =
        `calc(100vh - ${pos.top}px)`;

    const columns = Math.ceil(

        (window.innerWidth - pos.left)
        / tileSize

    );

    const rows = Math.ceil(

        (window.innerHeight - pos.top)
        / tileSize

    );

    const totalTiles =
        columns * rows;

    for(let i=0; i<totalTiles; i++){

        const bgTile =
            document.createElement("div");

        bgTile.className = "bgTile";

        backgroundTiles.appendChild(bgTile);

    }

}

/* ========================= */
/* calendar */
/* ========================= */

function generateCalendar(){

    tileGrid.innerHTML = "";

    const pos =
        getTilePosition();

    tileGrid.style.left =
        pos.left + "px";

    tileGrid.style.top =
        pos.top + "px";

    const daysInMonth = new Date(

        currentYear,
        currentMonth + 1,
        0

    ).getDate();

    const firstDay = new Date(

        currentYear,
        currentMonth,
        1

    ).getDay();

    const monthNames = [

        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"

    ];

    document.getElementById("monthTitle")
        .innerText =

        `${monthNames[currentMonth]} ${currentYear}`;

    /* empty spaces */

    for(let j=0; j<firstDay; j++){

        const empty =
            document.createElement("div");

        empty.className =
            "tile emptyTile";

        tileGrid.appendChild(empty);

    }

    /* real days */

    for(let i=1; i<=daysInMonth; i++){

        const tile =
            document.createElement("div");

        const key =

            `${currentYear}-${currentMonth+1}-${i}`;

        const savedTile =
            savedData.tiles[key];

        tile.className = "tile";

        tile.dataset.day = i;

        tile.dataset.color =

            savedTile
            ? savedTile.color
            : "#8fb6ff";

        tile.dataset.note =

            savedTile
            ? savedTile.note
            : "";

        if(savedTile){

            tile.style.backgroundImage =
                `url('${savedTile.image}')`;

        }

        tile.innerHTML = `

            <div class="dayNumber">
                ${i}
            </div>

            <div class="tileNote">
                ${savedTile ? savedTile.note : ""}
            </div>

        `;

        /* hover */

        tile.addEventListener("mouseenter",()=>{

            activateTile(tile);

        });

        tile.addEventListener("mouseleave",()=>{

            deactivateTile(tile);

        });

        /* click */

        tile.addEventListener("click",()=>{

            openPopup(tile);

        });

        tileGrid.appendChild(tile);

    }

}

/* ========================= */
/* hover atmosphere */
/* ========================= */

function activateTile(tile){

    document
    .querySelectorAll(
        ".tile:not(.emptyTile)"
    )
    .forEach(t=>{

        t.classList.add("dimmed");

    });

    tile.classList.remove("dimmed");

    tile.classList.add("activeTile");

    const color =
        tile.dataset.color || "#8fb6ff";

    moodOverlay.style.opacity = "1";

    moodOverlay.style.background = `

    linear-gradient(
        to bottom,
        ${color}18 0%,
        ${color}10 40%,
        rgba(255,255,255,0.02) 100%
    )

    `;

}

function deactivateTile(tile){

    document
    .querySelectorAll(".tile")
    .forEach(t=>{

        t.classList.remove("dimmed");

    });

    tile.classList.remove("activeTile");

    moodOverlay.style.opacity = "0";

}

/* ========================= */
/* popup */
/* ========================= */

const popup =
    document.getElementById("popup");

function openPopup(tile){

    currentTile = tile;

    popup.style.display = "flex";

    document.getElementById("popupTitle")
        .innerText =

        `Day ${tile.dataset.day}`;

    document.getElementById("noteInput")
        .value =

        tile.dataset.note || "";

}

popup.addEventListener("click",(e)=>{

    if(e.target === popup){

        popup.style.display = "none";

    }

});

/* ========================= */
/* select tile mood */
/* ========================= */

function selectTile(
    element,
    image,
    color
){

    selectedTileImage = image;

    selectedMoodColor = color;

    document
    .querySelectorAll(".tileOption")
    .forEach(option=>{

        option.classList.remove("selected");

    });

    element.classList.add("selected");

}

/* ========================= */
/* save tile */
/* ========================= */

function saveTile(){

    const note =
        document.getElementById("noteInput")
        .value;

    currentTile.style.backgroundImage =

        `url('${selectedTileImage}')`;

    currentTile.dataset.color =
        selectedMoodColor;

    currentTile.dataset.note =
        note;

    currentTile.querySelector(".tileNote")
        .innerText = note;

    const key =

        `${currentYear}-${currentMonth+1}-${currentTile.dataset.day}`;

    savedData.tiles[key] = {

        image:selectedTileImage,

        color:selectedMoodColor,

        note:note

    };

    saveData();

    popup.style.display = "none";

    document.getElementById("noteInput")
        .value = "";

}

/* ========================= */
/* month switch */
/* ========================= */

function changeMonth(direction){

    currentMonth += direction;

    if(currentMonth > 11){

        currentMonth = 0;

        currentYear++;

    }

    if(currentMonth < 0){

        currentMonth = 11;

        currentYear--;

    }

    generateCalendar();

}

/* ========================= */
/* objects storage */
/* ========================= */

function updateObjectsStorage(){

    savedData.objects = [];

    document
    .querySelectorAll(".object")
    .forEach(obj=>{

        savedData.objects.push({

            image:
            obj.dataset.image,

            left:
            obj.style.left,

            top:
            obj.style.top,

            width:
            obj.style.width,

            height:
            obj.style.height

        });

    });

    saveData();

}

/* ========================= */
/* draggable + resize */
/* ========================= */

function makeDraggableAndResizable(item){

    let mode = null;

    let startX = 0;
    let startY = 0;

    let startLeft = 0;
    let startTop = 0;

    let startWidth = 0;
    let startHeight = 0;

    item.addEventListener("pointerdown",(e)=>{

        if(
            e.target.classList.contains(
                "deleteObject"
            )
        ) return;

        e.preventDefault();

        const isResize =

            e.target.classList.contains(
                "resizeHandle"
            );

        mode =
            isResize
            ? "resize"
            : "drag";

        startX = e.clientX;
        startY = e.clientY;

        startLeft = item.offsetLeft;
        startTop = item.offsetTop;

        startWidth = item.offsetWidth;
        startHeight = item.offsetHeight;

        item.setPointerCapture(e.pointerId);

        item.style.cursor =

            isResize
            ? "nwse-resize"
            : "grabbing";

    });

    item.addEventListener("pointermove",(e)=>{

        if(!mode) return;

        e.preventDefault();

        const dx =
            e.clientX - startX;

        const dy =
            e.clientY - startY;

        /* drag */

        if(mode === "drag"){

            item.style.left =
                startLeft + dx + "px";

            item.style.top =
                startTop + dy + "px";

        }

        /* resize */

        if(mode === "resize"){

            const newSize = Math.max(

                60,

                Math.max(
                    startWidth + dx,
                    startHeight + dy
                )

            );

            item.style.width =
                newSize + "px";

            item.style.height =
                newSize + "px";

        }

    });

    item.addEventListener("pointerup",(e)=>{

        mode = null;

        try{

            item.releasePointerCapture(
                e.pointerId
            );

        }catch(err){}

        item.style.cursor = "grab";

        updateObjectsStorage();

    });

    item.addEventListener("pointercancel",()=>{

        mode = null;

        item.style.cursor = "grab";

        updateObjectsStorage();

    });

}

/* ========================= */
/* spawn object */
/* ========================= */

function spawnObject(
    image,
    savedObj = null
){

    const obj =
        document.createElement("div");

    obj.className = "object";

    obj.dataset.image = image;

    obj.style.left =

        savedObj
        ? savedObj.left
        : "300px";

    obj.style.top =

        savedObj
        ? savedObj.top
        : "300px";

    obj.style.width =

        savedObj
        ? savedObj.width
        : "180px";

    obj.style.height =

        savedObj
        ? savedObj.height
        : "180px";

    obj.innerHTML = `

        <img src="${image}">

        <button class="deleteObject">
            ×
        </button>

        <div class="resizeHandle"></div>

    `;

    document
    .getElementById("bathroom")
    .appendChild(obj);

    makeDraggableAndResizable(obj);

    obj.querySelector(".deleteObject")
    .addEventListener("click",(e)=>{

        e.stopPropagation();

        obj.remove();

        updateObjectsStorage();

    });

    if(!savedObj){

        updateObjectsStorage();

    }

}

/* ========================= */
/* tray toggle */
/* ========================= */

const tray =
    document.getElementById("objectTray");

const toggleTray =
    document.getElementById("toggleTray");

let trayOpen = true;

toggleTray.addEventListener("click",()=>{

    trayOpen = !trayOpen;

    if(!trayOpen){

        tray.classList.add("closed");

        toggleTray.innerText = "→";

    }else{

        tray.classList.remove("closed");

        toggleTray.innerText = "←";

    }

});

/* ========================= */
/* resize */
/* ========================= */

window.addEventListener("resize",()=>{

    generateBackgroundTiles();

    generateCalendar();

});

/* ========================= */
/* init */
/* ========================= */

generateBackgroundTiles();

generateCalendar();

/* restore objects */

savedData.objects.forEach(obj=>{

    spawnObject(obj.image,obj);

});

</script>
