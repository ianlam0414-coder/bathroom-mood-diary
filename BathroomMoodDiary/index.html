<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Bathroom Mood Diary</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    overflow:hidden;
    background:#d8d0c4;
}

#bathroom{
    position:relative;
    width:100vw;
    height:100vh;
    overflow:hidden;
    background:#d8cdbd;
}

/* background tiles aligned with calendar */
#backgroundTiles{
    position:absolute;
    top:120px;
    left:240px;

    width:calc(100vw - 240px);
    height:calc(100vh - 120px);

    display:grid;
    grid-template-columns:repeat(auto-fill,110px);
    grid-auto-rows:110px;

    z-index:0;
    pointer-events:none;
}

.bgTile{
    background-image:url("tile-baseold.png");
    background-size:cover;
    background-position:center;
}

#moodOverlay{
    position:absolute;
    inset:0;
    pointer-events:none;
    opacity:0;
    transition:0.45s;
    z-index:3;
}

.fog{
    position:absolute;
    inset:0;
    backdrop-filter:blur(1.5px);
    background:rgba(255,255,255,0.03);
    pointer-events:none;
    z-index:1;
}

.mainTitle{
    position:absolute;
    top:35px;
    left:40px;
    z-index:60;
}

.mainTitle h2{
    font-size:42px;
    font-weight:300;
}

.mainTitle p{
    margin-top:8px;
    opacity:0.5;
}

.calendarHeader{
    position:absolute;
    top:35px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    align-items:center;
    gap:25px;
    z-index:60;
    background:rgba(255,255,255,0.45);
    backdrop-filter:blur(10px);
    padding:14px 24px;
    border-radius:25px;
}

.calendarHeader h1{
    font-size:34px;
    font-weight:300;
}

.calendarHeader button{
    width:40px;
    height:40px;
    border:none;
    border-radius:50%;
    background:white;
    cursor:pointer;
    font-size:20px;
}

/* calendar mood tiles */
#tileGrid{
    position:absolute;
    top:120px;
    left:240px;

    display:grid;
    grid-template-columns:repeat(7,110px);
    grid-auto-rows:110px;
    gap:0;

    z-index:10;
}

.tile{
    width:110px;
    height:110px;
    position:relative;
    overflow:hidden;
    cursor:pointer;

    background-image:url("tile-baseold.png");
    background-size:cover;
    background-position:center;

    transition:
        transform 0.3s,
        box-shadow 0.3s,
        filter 0.3s;
}

.tile.activeTile{
    z-index:100;
    transform:scale(1.08);
    box-shadow:0 0 40px rgba(255,255,255,0.35);
    filter:brightness(1.15);
}

.tile.dimmed{
    filter:brightness(0.3);
}

.dayNumber{
    position:absolute;
    top:10px;
    left:12px;
    font-size:14px;
    color:white;
    text-shadow:0 2px 10px rgba(0,0,0,0.45);
}

.tileNote{
    position:absolute;
    left:12px;
    right:12px;
    bottom:12px;

    font-size:13px;
    line-height:1.4;

    color:white;
    text-shadow:0 2px 10px rgba(0,0,0,0.5);

    opacity:0;
    transform:translateY(10px);
    transition:0.4s;

    word-break:break-word;
}

.tile.activeTile .tileNote{
    opacity:1;
    transform:translateY(0);
}

/* object tray */
#objectTray{
    position:absolute;
    left:20px;
    top:120px;

    width:190px;

    background:rgba(255,255,255,0.45);
    backdrop-filter:blur(12px);

    border-radius:25px;
    padding:18px;

    z-index:80;
    transition:0.4s;
}

#objectTray.closed{
    transform:translateX(-165px);
}

#toggleTray{
    position:absolute;
    right:-18px;
    top:20px;

    width:38px;
    height:38px;

    border:none;
    border-radius:50%;
    background:white;
    cursor:pointer;
}

.trayTitle{
    margin-bottom:16px;
    font-size:14px;
    opacity:0.5;
}

.trayItem{
    width:100%;
    height:90px;

    border-radius:18px;
    background:rgba(255,255,255,0.5);

    margin-bottom:12px;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;
    transition:0.3s;
}

.trayItem:hover{
    transform:scale(1.03);
}

.trayItem img{
    width:70%;
    height:70%;
    object-fit:contain;
}

/* draggable objects */
.object{
    position:absolute;

    width:180px;
    height:180px;

    resize:both;
    overflow:auto;

    cursor:grab;
    user-select:none;

    z-index:20;
}

.object img{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
}

.deleteObject{
    position:absolute;
    top:5px;
    right:5px;

    width:28px;
    height:28px;

    border:none;
    border-radius:50%;
    background:white;

    cursor:pointer;
    font-size:18px;

    opacity:0;
    transition:0.3s;
}

.object:hover .deleteObject{
    opacity:1;
}

/* popup */
#popup{
    position:fixed;
    inset:0;

    background:rgba(0,0,0,0.45);

    display:none;
    justify-content:center;
    align-items:center;

    z-index:200;
}

.popupCard{
    width:390px;

    background:rgba(255,255,255,0.94);
    backdrop-filter:blur(15px);

    border-radius:25px;
    padding:24px;
}

.popupCard h2{
    margin-bottom:18px;
    font-weight:400;
}

.popupCard label{
    display:block;
    margin-bottom:8px;
    opacity:0.7;
}

.tileSelector{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.tileOption{
    width:65px;
    height:65px;

    border-radius:12px;

    background-size:cover;
    background-position:center;

    cursor:pointer;

    border:2px solid transparent;
    transition:0.3s;
}

.tileOption:hover,
.tileOption.selected{
    transform:scale(1.08);
    border-color:black;
}

textarea{
    width:100%;
    height:140px;

    resize:none;

    border:none;
    border-radius:15px;

    background:#f2f2f2;

    padding:15px;
}

.saveBtn{
    width:100%;

    padding:15px;

    border:none;
    border-radius:14px;

    background:black;
    color:white;

    margin-top:18px;

    cursor:pointer;
}

.footerText{
    position:absolute;
    bottom:20px;
    left:50%;

    transform:translateX(-50%);

    opacity:0.4;

    z-index:50;
}
</style>
</head>

<body>

<div id="bathroom">

    <div id="backgroundTiles"></div>
    <div id="moodOverlay"></div>
    <div class="fog"></div>

    <div class="mainTitle">
        <h2>Bathroom Mood Diary</h2>
        <p>Leave your emotions on the wall</p>
    </div>

    <div class="calendarHeader">
        <button onclick="changeMonth(-1)">←</button>
        <h1 id="monthTitle"></h1>
        <button onclick="changeMonth(1)">→</button>
    </div>

    <div id="objectTray">
        <button id="toggleTray">←</button>

        <div class="trayTitle">Bathroom Objects</div>

        <div class="trayItem" onclick="spawnObject('toilet.png')">
            <img src="toilet.png">
        </div>

        <div class="trayItem" onclick="spawnObject('sink.png')">
            <img src="sink.png">
        </div>

        <div class="trayItem" onclick="spawnObject('shower.png')">
            <img src="shower.png">
        </div>

        <div class="trayItem" onclick="spawnObject('mirror.png')">
            <img src="mirror.png">
        </div>
    </div>

    <div id="tileGrid"></div>

    <div id="popup">
        <div class="popupCard">

            <h2 id="popupTitle">Day</h2>

            <label>Choose Tile Mood</label>

            <div class="tileSelector">

                <div
                    class="tileOption selected"
                    style="background-image:url('tile-blue.png')"
                    onclick="selectTile(this,'tile-blue.png','#8fb6ff')">
                </div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-pink.png')"
                    onclick="selectTile(this,'tile-pink.png','#ffb3d9')">
                </div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-green.png')"
                    onclick="selectTile(this,'tile-green.png','#9fd9b3')">
                </div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-purple.png')"
                    onclick="selectTile(this,'tile-purple.png','#b99cff')">
                </div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-orange.png')"
                    onclick="selectTile(this,'tile-orange.png','#ffb36b')">
                </div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-red.png')"
                    onclick="selectTile(this,'tile-red.png','#ff7a7a')">
                </div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-grey.png')"
                    onclick="selectTile(this,'tile-grey.png','#8a8a8a')">
                </div>

                <div
                    class="tileOption"
                    style="background-image:url('tile-white.png')"
                    onclick="selectTile(this,'tile-white.png','#ffffff')">
                </div>

                <!--
                To add more tile moods, copy this block:

                <div
                    class="tileOption"
                    style="background-image:url('tile-YOURNAME.png')"
                    onclick="selectTile(this,'tile-YOURNAME.png','#YOURCOLOR')">
                </div>

                Then add the matching image file:
                tile-YOURNAME.png
                -->

            </div>

            <textarea
                id="noteInput"
                placeholder="What did this bathroom moment feel like?"></textarea>

            <button class="saveBtn" onclick="saveTile()">
                Save Memory
            </button>

        </div>
    </div>

    <div class="footerText">
        Every tile remembers something.
    </div>

</div>

<script>
const tileGrid = document.getElementById("tileGrid");
const backgroundTiles = document.getElementById("backgroundTiles");
const moodOverlay = document.getElementById("moodOverlay");

let currentDate = new Date();
let currentMonth = currentDate.getMonth();
let currentYear = currentDate.getFullYear();

let currentTile = null;

let selectedTileImage = "tile-blue.png";
let selectedMoodColor = "#8fb6ff";

function generateBackgroundTiles(){
    backgroundTiles.innerHTML = "";

    const tileSize = 110;
    const columns = Math.ceil((window.innerWidth - 240) / tileSize);
    const rows = Math.ceil((window.innerHeight - 120) / tileSize);
    const totalTiles = columns * rows;

    for(let i = 0; i < totalTiles; i++){
        const bgTile = document.createElement("div");
        bgTile.className = "bgTile";
        backgroundTiles.appendChild(bgTile);
    }
}

function generateCalendar(){
    tileGrid.innerHTML = "";

    const daysInMonth = new Date(
        currentYear,
        currentMonth + 1,
        0
    ).getDate();

    const monthNames = [
        "January","February","March","April",
        "May","June","July","August",
        "September","October","November","December"
    ];

    document.getElementById("monthTitle").innerText =
        `${monthNames[currentMonth]} ${currentYear}`;

    for(let i = 1; i <= daysInMonth; i++){
        const tile = document.createElement("div");

        tile.className = "tile";
        tile.dataset.day = i;
        tile.dataset.color = "#8fb6ff";
        tile.dataset.note = "";
        tile.style.backgroundImage = "url('tile-baseold.png')";

        tile.innerHTML = `
            <div class="dayNumber">${i}</div>
            <div class="tileNote"></div>
        `;

        tile.addEventListener("mouseenter",()=>{
            document.querySelectorAll(".tile").forEach(t=>{
                t.classList.add("dimmed");
            });

            tile.classList.remove("dimmed");
            tile.classList.add("activeTile");

            const color = tile.dataset.color || "#8fb6ff";

            moodOverlay.style.opacity = "1";
            moodOverlay.style.background = `
                radial-gradient(
                    circle at center,
                    ${color}99 0%,
                    ${color}22 35%,
                    rgba(0,0,0,0.85) 100%
                )
            `;
        });

        tile.addEventListener("mouseleave",()=>{
            document.querySelectorAll(".tile").forEach(t=>{
                t.classList.remove("dimmed");
            });

            tile.classList.remove("activeTile");
            moodOverlay.style.opacity = "0";
        });

        tile.addEventListener("click",()=>{
            openPopup(tile);
        });

        tileGrid.appendChild(tile);
    }
}

function selectTile(element,image,color){
    selectedTileImage = image;
    selectedMoodColor = color;

    document.querySelectorAll(".tileOption").forEach(option=>{
        option.classList.remove("selected");
    });

    element.classList.add("selected");
}

const popup = document.getElementById("popup");

function openPopup(tile){
    currentTile = tile;

    popup.style.display = "flex";

    document.getElementById("popupTitle").innerText =
        `Day ${tile.dataset.day}`;

    document.getElementById("noteInput").value =
        tile.dataset.note || "";
}

popup.addEventListener("click",(e)=>{
    if(e.target === popup){
        popup.style.display = "none";
    }
});

function saveTile(){
    const note = document.getElementById("noteInput").value;

    currentTile.style.backgroundImage =
        `url('${selectedTileImage}')`;

    currentTile.dataset.color = selectedMoodColor;
    currentTile.dataset.note = note;

    currentTile.querySelector(".tileNote").innerText = note;

    popup.style.display = "none";
    document.getElementById("noteInput").value = "";
}

function changeMonth(direction){
    currentMonth += direction;

    if(currentMonth > 11){
        currentMonth = 0;
        currentYear++;
    }

    if(currentMonth < 0){
        currentMonth = 11;
        currentYear--;
    }

    generateCalendar();
}

function makeDraggable(item){
    let isDragging = false;
    let offsetX, offsetY;

    item.addEventListener("mousedown",(e)=>{
        if(e.target.classList.contains("deleteObject")) return;

        isDragging = true;

        offsetX = e.clientX - item.offsetLeft;
        offsetY = e.clientY - item.offsetTop;

        item.style.cursor = "grabbing";
    });

    document.addEventListener("mousemove",(e)=>{
        if(!isDragging) return;

        item.style.left = (e.clientX - offsetX) + "px";
        item.style.top = (e.clientY - offsetY) + "px";
    });

    document.addEventListener("mouseup",()=>{
        isDragging = false;
        item.style.cursor = "grab";
    });
}

function spawnObject(image){
    const obj = document.createElement("div");

    obj.className = "object";
    obj.style.left = "300px";
    obj.style.top = "300px";

    obj.innerHTML = `
        <img src="${image}">
        <button class="deleteObject">×</button>
    `;

    document.getElementById("bathroom").appendChild(obj);

    makeDraggable(obj);

    obj.querySelector(".deleteObject").addEventListener("click",()=>{
        obj.remove();
    });
}

const tray = document.getElementById("objectTray");
const toggleTray = document.getElementById("toggleTray");

let trayOpen = true;

toggleTray.addEventListener("click",()=>{
    trayOpen = !trayOpen;

    if(!trayOpen){
        tray.classList.add("closed");
        toggleTray.innerText = "→";
    }else{
        tray.classList.remove("closed");
        toggleTray.innerText = "←";
    }
});

window.addEventListener("resize",()=>{
    generateBackgroundTiles();
});

generateBackgroundTiles();
generateCalendar();
</script>

</body>
</html>
